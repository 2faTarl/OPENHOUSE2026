<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Kanaan Global School - Photo Booth</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">

        <!-- HEADER -->
        <header class="header">

            <div class="brand">

                <img
                    src="images/logo-kanaan.png"
                    alt="Kanaan Global School"
                    class="brand-logo"
                >

                <div class="brand-text">
                    <h1>Photo Booth</h1>
                    <p>Open House 2026</p>
                </div>

            </div>


            <button
                id="fullscreenBtn"
                class="icon-btn"
                title="Fullscreen"
                aria-label="Fullscreen"
            >

                <svg
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >
                    <path
                        d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"
                    />
                </svg>

            </button>

        </header>



        <!-- MAIN -->
        <section class="camera-section">

            <!-- ORNAMEN KANAAN -->
            <div class="ornament ornament-left"></div>
            <div class="ornament ornament-right"></div>


            <!-- CAMERA -->
            <div class="camera-container">

                <div class="camera-top">

                    <div>
                        <span class="live-dot"></span>
                        <span>CAMERA</span>
                    </div>

                    <span class="event-label">
                        OPEN HOUSE 2026
                    </span>

                </div>


                <div class="camera-wrapper">

                    <video
                        id="video"
                        autoplay
                        playsinline
                        muted
                    ></video>


                    <!-- COUNTDOWN -->
                    <div
                        id="countdown"
                        class="countdown hidden"
                    >
                        3
                    </div>


                    <!-- FLASH -->
                    <div
                        id="flash"
                        class="flash"
                    ></div>


                    <!-- ERROR -->
                    <div
                        id="cameraMessage"
                        class="camera-message hidden"
                    >

                        <img
                            src="images/logo-kanaan.png"
                            alt="Kanaan Global School"
                            class="camera-error-logo"
                        >

                        <h2>Kamera tidak tersedia</h2>

                        <p id="cameraMessageText">
                            Izinkan akses kamera untuk menggunakan Photo Booth.
                        </p>

                        <button id="retryCameraBtn">
                            Coba Lagi
                        </button>

                    </div>

                </div>

            </div>



            <!-- CONTROLS -->
            <div class="controls">

                <!-- SWITCH CAMERA -->
                <button
                    id="switchCameraBtn"
                    class="secondary-btn"
                    aria-label="Ganti Kamera"
                >

                    <span class="control-icon">

                        <svg viewBox="0 0 24 24">
                            <path
                                d="M20 7h-4V3"
                            />
                            <path
                                d="M20 7l-3.2-3.2A8 8 0 1 0 20 12"
                            />
                        </svg>

                    </span>

                    <small>Ganti Kamera</small>

                </button>


                <!-- CAPTURE -->
                <button
                    id="captureBtn"
                    class="capture-btn"
                    aria-label="Ambil Foto"
                >

                    <span class="capture-inner">

                        <svg viewBox="0 0 24 24">
                            <path
                                d="M9 5l1.5-2h3L15 5h3a3 3 0 0 1 3 3v9a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V8a3 3 0 0 1 3-3h3z"
                            />

                            <circle
                                cx="12"
                                cy="12.5"
                                r="4"
                            />
                        </svg>

                    </span>

                </button>


                <!-- CLEAR -->
                <button
                    id="clearBtn"
                    class="secondary-btn"
                    aria-label="Hapus Foto"
                >

                    <span class="control-icon">

                        <svg viewBox="0 0 24 24">
                            <path
                                d="M4 7h16"
                            />

                            <path
                                d="M9 7V4h6v3"
                            />

                            <path
                                d="M7 7l1 13h8l1-13"
                            />
                        </svg>

                    </span>

                    <small>Hapus Foto</small>

                </button>

            </div>


            <div class="photo-hint">
                Tekan tombol kamera untuk mengambil foto
            </div>

        </section>



        <!-- GALLERY -->
        <section
            id="gallerySection"
            class="gallery-section hidden"
        >

            <div class="gallery-header">

                <div>
                    <span class="section-label">
                        YOUR PHOTO
                    </span>

                    <h2>Hasil Foto</h2>

                    <p>
                        Klik foto untuk melihat hasil.
                    </p>
                </div>

            </div>


            <div
                id="gallery"
                class="gallery"
            ></div>

        </section>

    </main>



    <!-- PHOTO PREVIEW -->
    <div
        id="previewModal"
        class="modal hidden"
    >

        <div
            id="modalBackdrop"
            class="modal-backdrop"
        ></div>


        <div class="modal-content">

            <div class="modal-brand">

                <img
                    src="images/logo-kanaan.png"
                    alt="Kanaan"
                >

                <span>
                    KANAAN GLOBAL SCHOOL
                </span>

            </div>


            <button
                id="closeModalBtn"
                class="close-btn"
                aria-label="Tutup"
            >
                ×
            </button>


            <img
                id="previewImage"
                class="preview-image"
                alt="Hasil foto"
            >


            <div class="modal-actions">

                <button
                    id="downloadBtn"
                    class="download-btn"
                >

                    <svg viewBox="0 0 24 24">
                        <path
                            d="M12 3v12"
                        />

                        <path
                            d="M7 10l5 5 5-5"
                        />

                        <path
                            d="M5 21h14"
                        />
                    </svg>

                    Download Foto

                </button>


                <button
                    id="deletePhotoBtn"
                    class="delete-btn"
                >
                    Foto Lagi
                </button>

            </div>

        </div>

    </div>



    <!-- CANVAS -->
    <canvas id="canvas"></canvas>


    <script src="app.js"></script>

</body>
</html>
